<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mai-Score</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header><img src="icons/icon.svg" alt=""><div><h1>Mai-Score</h1><p>International B50 exporter</p></div></header>
      <div id="status" class="status">請先登入 maimai DX NET 國際版。</div>
      <section id="summary" class="summary" hidden>
        <div><span>玩家</span><strong id="player">—</strong></div>
        <div><span>官方 Rating</span><strong id="official-rating">—</strong></div>
        <div><span>B50 合計</span><strong id="b50-rating">—</strong></div>
        <div><span>已解析</span><strong id="resolved">—</strong></div>
      </section>
      <button id="collect" class="primary">抓取 B50</button>
      <button id="studio" class="studio-button" disabled>在網頁預覽並調整</button>
      <details class="direct-export">
        <summary>直接匯出</summary>
        <div class="export-picker">
          <select id="export-format" aria-label="直接匯出格式">
            <option value="png">快速 PNG（預設樣式）</option>
            <option value="dxrating">dxrating JSON</option>
            <option value="full">Mai-Score 完整 JSON</option>
            <option value="rhythm">Rhythm Record JSON</option>
          </select>
          <button id="export" disabled>下載</button>
        </div>
      </details>
      <p class="privacy">資料只在瀏覽器本機處理；網頁預覽使用一次性交換碼。</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
