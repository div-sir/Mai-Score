name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag matching the checked-out package, e.g. v0.16.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_TAG: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const version = read('package.json').version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw Error('Expected stable semver');
          for (const path of ['package-lock.json','studio/package.json','studio/package-lock.json','public/manifest.json']) {
            const data = read(path);
            if (data.version !== version || (data.packages && data.packages[''].version !== version)) throw Error(`Version mismatch: ${path}`);
          }
          const tag = `v${version}`;
          const requested = process.env.EVENT_NAME === 'workflow_dispatch' ? process.env.REQUESTED_TAG : process.env.GITHUB_REF_TYPE === 'tag' ? process.env.GITHUB_REF_NAME : tag;
          if (requested !== tag) throw Error('Tag does not match package version');
          let publish = true;
          if (process.env.EVENT_NAME === 'push' && process.env.GITHUB_REF_TYPE === 'branch') {
            const previous = JSON.parse(execFileSync('git', ['show', `${process.env.BEFORE_SHA}:package.json`], {encoding:'utf8'}));
            publish = previous.version !== version;
          }
          try {
            const existing = execFileSync('git', ['rev-parse', '--verify', `refs/tags/${tag}^{commit}`], {encoding:'utf8',stdio:['ignore','pipe','ignore']}).trim();
            if (existing !== process.env.GITHUB_SHA) throw Error('Existing tag points to a different commit');
          } catch (error) { if (!error.status) throw error; }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\npublish=${publish}\n`);
          JS

  package:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - run: npm ci
        working-directory: studio
      - run: npm run typecheck && npm run build
        working-directory: studio
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Package verified extension
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          (cd dist && zip -r "../mai-score-${RELEASE_TAG}.zip" .)
          sha256sum "mai-score-${RELEASE_TAG}.zip" > "mai-score-${RELEASE_TAG}.zip.sha256"
      - name: Extract release notes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json')).version;
          const text = fs.readFileSync('CHANGELOG.md','utf8');
          const start = text.indexOf(`## [${version}]`);
          if (start < 0) throw Error('Missing release notes');
          const end = text.indexOf('\n## [', start + 1);
          fs.writeFileSync('release-notes.md',text.slice(start,end < 0 ? undefined : end));
          JS
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mai-Score ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: |
            mai-score-*.zip
            mai-score-*.zip.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
