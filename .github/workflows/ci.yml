name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run verify
      - name: Prepare exact-origin preview build
        run: node scripts/prepare-preview-build.mjs https://mai-score-git-claude-mai-score-progre-2e97dc-soliliums-projects.vercel.app
      - name: Package preview extension
        run: |
          cd dist
          zip -r ../mai-score-extension-preview.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: mai-score-extension-preview
          path: mai-score-extension-preview.zip
          if-no-files-found: error
          retention-days: 14

  studio:
    name: Studio
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: studio
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
